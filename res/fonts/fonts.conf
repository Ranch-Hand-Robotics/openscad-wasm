<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<dir>ttf</dir>

	<alias>
		<family>sans</family>
		<prefer>
			<family>Liberation Sans</family>
		</prefer>
	</alias>

	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Liberation Sans</family>
		</prefer>
	</alias>

	<alias>
		<family>Comic Sans MS</family>
		<prefer>
			<family>Liberation Sans</family>
		</prefer>
	</alias>
</fontconfig>
